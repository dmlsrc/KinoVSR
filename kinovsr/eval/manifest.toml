schema_version = 1

[owner]
kind = "evaluator"
name = "eval"

# Shared assets of the eval toolkit (kinovsr/eval/weights/): the YuNet
# face detector behind `kinovsr metrics faces` and the NIQE pristine
# model behind `kinovsr metrics niqe`.

[weights.face_yunet]
path = "weights/face_detection_yunet_2023mar.onnx"
distribution = "bundled"
artifact_sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
source = "https://huggingface.co/opencv/opencv_zoo/blob/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx"
source_sha256 = "8f2383e4dd3cfbb4553ea8718107fc0423210dc964f9f4280604804ed2552fa4"
license = "MIT"

# First-party artifact: NIQE pristine statistics fitted locally from
# clean REDS sharp frames with `kinovsr metrics niqe --fit` (no upstream
# download; the NIQE method is Mittal et al. 2013).
[weights.niqe_pristine]
path = "weights/niqe_pristine_reds.safetensors"
distribution = "bundled"
artifact_sha256 = "d0850ab291a1c74bfe89d27a3e03a75f6991d3970b77800b51e2bdbaf5bad0f3"
license = "first-party fitted statistics"
