schema_version = 1

[owner]
kind = "processor"
name = "toflow"

# Every checkpoint is a converted Torch7 .t7 plus a same-stem .json static
# graph; the runtime needs BOTH files of a pair. source_sha256 is the
# upstream .t7; artifact_sha256 covers each bundled converted file.

[profiles.denoise]
capabilities = ["denoise"]
weights = ["denoise", "denoise_graph"]

[profiles.deblock]
capabilities = ["deblock"]
weights = ["deblock", "deblock_graph"]

[profiles.sr]
capabilities = ["upscale"]
weights = ["sr", "sr_graph"]

# interp is reachable through the TOFlowInterpolator API class only; no
# CLI flag selects it today.
[profiles.interp]
capabilities = ["interpolate"]
weights = ["interp", "interp_graph"]

[weights.denoise]
path = "weights/toflow_denoise.safetensors"
