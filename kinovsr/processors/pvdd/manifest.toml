schema_version = 1

[owner]
kind = "processor"
name = "pvdd"

# One Google Drive archive holds all six checkpoints as
# <subdir>/g_net_100000.pth; no direct URLs exist. source_sha256 is the
# member .pth. The raw variants expect packed Bayer input, not sRGB video.

[profiles.pvdd]
capabilities = ["denoise"]
weights = ["pvdd"]

[profiles.crvd]
capabilities = ["denoise"]
weights = ["crvd"]

[profiles.davis]
capabilities = ["denoise"]
weights = ["davis"]

[profiles.pvdd_level]
capabilities = ["denoise"]
weights = ["pvdd_level"]

[profiles.pvdd_raw]
capabilities = ["denoise"]
weights = ["pvdd_raw"]

[profiles.pvdd_raw_level]
capabilities = ["denoise"]
weights = ["pvdd_raw_level"]

[weights.pvdd]
path = "weights/pvdd_srgb_nolevel.safetensors"
distribution = "external"
source = "https://drive.google.com/drive/folders/1qEmupCR4JcaPNky3B5ldRN88t8K6CGaG (pvdd_srgb_nolevel/g_net_100000.pth)"
source_sha256 = "c76b91c66a6e923e03a8f4847af61968b889c34911ee964a2894506d169d0eff"
