schema_version = 1

[owner]
kind = "processor"
name = "basicvsrpp"

# SR checkpoints (--upscale basicvsrpp; --basicvsrpp-profile). The CLI
# default profile is vimeo90k_bd; the loader's bare-token fallback is
# reds4. source_sha256 is the upstream mmediting .pth; no artifact hashes
# are recorded because none of these are bundled.

[profiles.reds4]
capabilities = ["upscale"]
weights = ["reds4"]

[profiles.vimeo90k_bi]
capabilities = ["upscale"]
weights = ["vimeo90k_bi"]

[profiles.vimeo90k_bd]
capabilities = ["upscale"]
weights = ["vimeo90k_bd"]

[profiles.ntire_vsr]
capabilities = ["upscale"]
weights = ["ntire_vsr"]

# Restoration checkpoints (--restore VARIANT[,VARIANT...]).

[profiles.decompress_track1]
capabilities = ["restore"]
weights = ["decompress_track1"]

[profiles.decompress_track2]
capabilities = ["restore"]
weights = ["decompress_track2"]

[profiles.decompress_track3]
capabilities = ["restore"]
weights = ["decompress_track3"]

[profiles.denoise]
capabilities = ["restore"]
weights = ["denoise"]

[profiles.deblur_dvd]
capabilities = ["restore"]
weights = ["deblur_dvd"]

[profiles.deblur_gopro]
capabilities = ["restore"]
weights = ["deblur_gopro"]

[weights.reds4]
path = "weights/basicvsrpp_reds4.safetensors"
