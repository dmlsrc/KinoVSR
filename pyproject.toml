[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinovsr"
version = "0.1.0"
description = "MLX-native video super-resolution and restoration for Apple Silicon"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "KinoVSR Contributors"}
]
keywords = [
    "apple silicon",
    "mlx",
    "video restoration",
    "video super-resolution",
    "vsr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32.0",
    "rich>=15.0",
    "pyobjc-core>=12.2",
    "pyobjc-framework-AVFoundation>=12.2",
    "pyobjc-framework-CoreAudio>=12.2",
    "pyobjc-framework-CoreMedia>=12.2",
    "pyobjc-framework-Cocoa>=12.2",
    "pyobjc-framework-libdispatch>=12.2",
    "pyobjc-framework-Metal>=12.2",
    "pyobjc-framework-MetalFX>=12.2",
    "pyobjc-framework-Quartz>=12.2",
    "pyobjc-framework-VideoToolbox>=12.2",
]

[project.optional-dependencies]
dev = [
    "av>=18.0",
    # NumPy is a dev/test/diagnostic oracle, not a runtime dependency. Product
    # code that needs it must import it dynamically through kinovsr._optional.
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
ffmpeg = [
    "av>=18.0",
]
eval = [
    "av>=18.0",
    "opencv-python-headless>=5.0",
]

[project.urls]
Homepage = "https://github.com/dmlsrc/KinoVSR"
Repository = "https://github.com/dmlsrc/KinoVSR"
Issues = "https://github.com/dmlsrc/KinoVSR/issues"

[project.scripts]
kinovsr = "kinovsr.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["kinovsr"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_weights: marks tests that require model weights",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
pythonpath = "."

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Match KinoMLX's stricter lint posture: core pycodestyle/pyflakes/import
# checks, bugbear, pyupgrade, simplification, pathlib, pytest style, no bare
# package prints, and ASCII-only source text.
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RET", "PIE", "PT", "T20",
    "RUF001", "RUF002", "RUF003", "PLC2401", "PLC2403",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Scripts are CLI/diagnostic entry points; print() is legitimate user output
# there. The inherited harness also has source-checkout import setup before
# package imports.
"scripts/**" = ["T20"]
"scripts/vsr_harness.py" = ["E402", "T20"]
# Transitional: inherited runtime modules still emit CLI/progress/demo
# output with bare print. New package modules (cli, ui, config, api,
# settings, reporting) use logging or the reporter instead - keep them
# OUT of this list. Entries disappear as M4 migrates each family.
"kinovsr/_harness.py" = ["T20"]
"kinovsr/basicvsrpp/**" = ["T20"]
"kinovsr/deform_conv.py" = ["T20"]
"kinovsr/dover/**" = ["T20"]
"kinovsr/encode.py" = ["T20"]
"kinovsr/esc/**" = ["T20"]
"kinovsr/fbcnn/**" = ["T20"]
"kinovsr/ffmpeg_encoder.py" = ["T20"]
"kinovsr/musiq/**" = ["T20"]
"kinovsr/nafnet/**" = ["T20"]
"kinovsr/progress/**" = ["T20"]
"kinovsr/realbasicvsr/**" = ["T20"]
"kinovsr/realesrgan/**" = ["T20"]
"kinovsr/realplksr/**" = ["T20"]
"kinovsr/realviformer/**" = ["T20"]
"kinovsr/safmn/**" = ["T20"]
"kinovsr/stdf/**" = ["T20"]
"kinovsr/temporal.py" = ["T20"]
"kinovsr/toflow/**" = ["T20"]
"kinovsr/vsr.py" = ["T20"]
"kinovsr/writer.py" = ["T20"]
# Transitional: legacy tests predate KinoMLX's stricter pytest style.
"tests/**" = ["PT006", "PT011", "PT018"]
