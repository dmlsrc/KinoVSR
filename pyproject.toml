[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kinovsr"
version = "0.1.0"
description = "MLX-native video super-resolution and restoration for Apple Silicon"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "KinoVSR Contributors"}
]
keywords = [
    "apple silicon",
    "mlx",
    "video restoration",
    "video super-resolution",
    "vsr",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mlx>=0.32.0",
    # Serializes first-party Core ML model conversions (kinovsr.native.anemil);
    # abi3 wheels, imported lazily and only when a conversion actually runs.
    "protobuf>=4.25",
    "rich>=15.0",
    "pyobjc-core>=12.2",
    "pyobjc-framework-AVFoundation>=12.2",
    "pyobjc-framework-CoreAudio>=12.2",
    "pyobjc-framework-CoreMedia>=12.2",
    "pyobjc-framework-Cocoa>=12.2",
    "pyobjc-framework-libdispatch>=12.2",
    "pyobjc-framework-Metal>=12.2",
    "pyobjc-framework-MetalFX>=12.2",
    "pyobjc-framework-Quartz>=12.2",
    "pyobjc-framework-VideoToolbox>=12.2",
    "pyobjc-framework-Vision>=12.2",
]

[project.optional-dependencies]
dev = [
    "av>=18.0",
    # NumPy is a dev/test/diagnostic oracle, not a core runtime dependency.
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0",
    "pytest>=9.1.0",
    "ruff>=0.15.17",
    # Torch is the checkpoint-reading oracle: test fixtures save .pth files,
    # the family-local layout converters read them, and
    # scripts/dev/pth_to_safetensors.py cross-checks the torch-free
    # `kinovsr weights convert`. safetensors (a separate package, not part
    # of torch) is that oracle's writer. Neither is ever a runtime
    # dependency: the product reads and writes safetensors through
    # mlx.core.
    "safetensors>=0.7",
    "torch>=2.13",
]
ffmpeg = [
    "av>=18.0",
]
eval = [
    "av>=18.0",
    "numpy>=2.4.6",
    "opencv-python-headless>=5.0",
]

[project.urls]
Homepage = "https://github.com/dmlsrc/KinoVSR"
Repository = "https://github.com/dmlsrc/KinoVSR"
Issues = "https://github.com/dmlsrc/KinoVSR/issues"

[project.scripts]
kinovsr = "kinovsr.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["kinovsr"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --import-mode=importlib"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "requires_weights: marks tests that require model weights",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]
pythonpath = "."

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
# Match KinoMLX's stricter lint posture: core pycodestyle/pyflakes/import
# checks, bugbear, pyupgrade, simplification, pathlib, pytest style, no bare
# package prints, and ASCII-only source text.
select = [
    "E", "W", "F", "I", "B", "C4", "UP", "SIM", "PTH", "RET", "PIE", "PT", "T20",
    "RUF001", "RUF002", "RUF003", "PLC2401", "PLC2403",
]
ignore = [
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
# Transitional: legacy tests predate KinoMLX's stricter pytest style.
"tests/**" = ["PT006", "PT011", "PT018"]
